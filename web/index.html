<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sized separately on purpose. The mark is a crowned P inside a ring, and at 16px that ring
         is under one pixel and turns the whole thing into a grey blob — so favicon-16 drops it and
         gives the letter the frame. A single SVG favicon cannot vary like that, which is why there
         isn't one. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icon-180.png" />
    <meta id="app-viewport" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // WebKit miscalculates the bottom edge when an iOS home-screen app combines
      // viewport-fit=cover with a locked root. Select the inset viewport before first layout.
      if (window.navigator.standalone === true) {
        document.getElementById('app-viewport').content = 'width=device-width, initial-scale=1.0';
        document.documentElement.classList.add('ios-standalone');
      }
    </script>
    <meta name="theme-color" content="#080d0b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f5f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080d0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Parakkat HR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Parakkat HR — centralized, branch and department scoped HR management for the Parakkat group." />
    <title>Parakkat HR</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Boot guard. Hashed assets are served with `immutable`, and Vercel applies that same
      // header to a 404 — so a request that misses during a deploy leaves a 404 pinned in the
      // browser's disk cache for a year, and `immutable` means it is never revalidated. The app
      // is then permanently blank on that device: React never mounts, so neither the service
      // worker update path nor the in-app version check ever gets to run. Nothing inside the
      // bundle can fix this, because the bundle is the thing that will not load.
      //
      // So: if #root is still empty well after load, force-refetch the entry assets with
      // `cache: 'reload'` (the one fetch mode that bypasses *and* overwrites the HTTP cache),
      // drop the service worker and its caches, then reload. Once per tab — a repair that
      // failed must not become a refresh loop.
      (function () {
        var KEY = 'pk-boot-repair';
        var GRACE_MS = 9000;

        function booted() {
          var root = document.getElementById('root');
          return !!(root && root.firstElementChild);
        }

        function repair() {
          if (booted()) return;
          try {
            if (sessionStorage.getItem(KEY)) return; // already tried this tab; leave the page alone
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            return; // no sessionStorage (private mode) means no loop guard, so do nothing
          }

          var urls = [];
          document.querySelectorAll('script[src], link[rel="stylesheet"][href]').forEach(function (el) {
            var u = el.src || el.href;
            if (u && u.indexOf(location.origin) === 0) urls.push(u);
          });

          var jobs = urls.map(function (u) {
            return fetch(u, { cache: 'reload' }).catch(function () {});
          });

          if (window.caches) {
            jobs.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
          if (navigator.serviceWorker) {
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }

          Promise.all(jobs).then(function () {
            location.reload();
          });
        }

        // A successful boot clears the flag, so a later genuine failure can still repair itself.
        function settle() {
          if (booted()) {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
          } else {
            repair();
          }
        }

        window.addEventListener('load', function () { setTimeout(settle, GRACE_MS); });
      })();
    </script>
  </body>
</html>
