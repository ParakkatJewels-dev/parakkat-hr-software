<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a7d53" />
    <title>Page not found · Parakkat</title>
    <script>
      try {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch (_) { /* The page works when storage is unavailable. */ }
    </script>
    <style>
      :root { color-scheme: light; --page: #f7f9f8; --card: #fff; --text: #17231e; --muted: #54635b; --border: #dce5df; --accent: #08784e; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--page); color: var(--text); }
      :root[data-theme="dark"] { color-scheme: dark; --page: #080d0b; --card: #101a15; --text: #f2f6f3; --muted: #acbcb2; --border: #2a3b31; --accent: #5dd9a0; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --page: #080d0b; --card: #101a15; --text: #f2f6f3; --muted: #acbcb2; --border: #2a3b31; --accent: #5dd9a0; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
      main { width: min(100%, 28rem); padding: clamp(1.25rem, 5vw, 2rem); border: 1px solid var(--border); border-radius: 1.25rem; background: var(--card); text-align: center; overflow-wrap: anywhere; }
      .brand { display: flex; align-items: center; justify-content: center; gap: .6rem; margin: 0; font-size: .9rem; font-weight: 750; }
      .mark { width: 1.75rem; height: 1.75rem; background: currentColor; -webkit-mask: url('/brand-mark.png') center / contain no-repeat; mask: url('/brand-mark.png') center / contain no-repeat; }
      .code { margin: 1.5rem 0 1rem; color: var(--accent); font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -.04em; }
      h1 { margin: 0 0 .75rem; font-size: 1.4rem; line-height: 1.25; }
      .message { margin: .5rem 0; color: var(--muted); font-size: .95rem; line-height: 1.6; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; width: 100%; margin-top: 1.25rem; padding: .75rem 1.25rem; border-radius: .75rem; background: #08784e; color: #fff; font-size: .95rem; font-weight: 750; text-decoration: none; }
      a:hover { background: #07653f; }
      a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
      @media (min-width: 480px) { a { width: auto; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <p class="brand"><span class="mark" aria-hidden="true"></span>Parakkat</p>
      <p class="code" aria-label="Error 404">404</p>
      <h1 id="not-found-title">Page not found</h1>
      <p class="message">This page doesn’t exist or the link has changed.</p>
      <p class="message">Go to Home to continue with your work.</p>
      <a href="/#/dashboard">Go to Home</a>
    </main>
  </body>
</html>
