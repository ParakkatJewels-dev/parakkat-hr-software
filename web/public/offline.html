<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Parakkat HR is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #f7f3ea;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        background:
          linear-gradient(135deg, rgba(14, 169, 113, .16), transparent 34rem),
          #0f0f0f;
      }

      main {
        width: min(100%, 28rem);
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: .5rem;
        padding: 1.25rem;
        background: rgba(23, 23, 23, .88);
        box-shadow: 0 20px 80px rgba(0, 0, 0, .28);
      }

      .mark {
        width: 2.5rem;
        height: 2.5rem;
        display: grid;
        place-items: center;
        border-radius: .5rem;
        background: #0ea971;
        color: #fff;
        font-weight: 800;
        letter-spacing: 0;
      }

      h1 {
        margin: 1rem 0 .5rem;
        font-size: 1.25rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #b8b2aa;
        font-size: .875rem;
        line-height: 1.6;
      }

      button {
        width: 100%;
        min-height: 2.75rem;
        margin-top: 1rem;
        border: 0;
        border-radius: .5rem;
        background: #0ea971;
        color: #fff;
        font: inherit;
        font-size: .875rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">HR</div>
      <h1>You're offline</h1>
      <p>Parakkat HR can open from your device, but live attendance, payroll, and approval data need the network before they can refresh.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
